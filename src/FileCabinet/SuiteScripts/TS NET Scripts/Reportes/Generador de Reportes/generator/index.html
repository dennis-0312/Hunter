<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EC - Generador de Reportes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
    <nav class="navbar fixed-top" style="background-color: #607799;">
        <div class="container-fluid">
            <a class="navbar-brand text-white fw-normal" href="!#">
                <img src="!#" alt="Logo" width="48" height="28" class="d-inline-block align-text-top">
                Oracle NetSuite
            </a>
        </div>
    </nav>
    <br>
    <h4 class="container-fluid mt-5">EC - Generador de Reportes</h4>
    <div class="container-fluid mt-4">
        <form id="reportForm" class="needs-validation" method="POST" action="">
            <button type="submit" class="btn btn-primary btn-sm mb-4">Generar</button>
            <div class="col-sm-12 d-flex">
                <section class="col-sm-6">
                    <div class="row mb-3">
                        <label for="custpage_report_field" class="col-sm-2 col-form-label">Reporte</label>
                        <div class="col-sm-6">
                            <select class="form-select col-sm-2 col-form-select-sm" id="custpage_report_field"
                                name="custpage_report_field" required>
                                <option value="">Seleccione...</option>
                                <option value="Reporte ATS">Reporte ATS</option>
                            </select>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <label for="custpage_subsidiary_field" class="col-sm-2 col-form-label">Subsidiaria</label>
                        <div class="col-sm-6">
                            <select class="form-select col-sm-2 col-form-select-sm" id="custpage_subsidiary_field"
                                name="custpage_subsidiary_field" required>
                                <option value="">Seleccione...</option>
                                <!--optionsContentSubsidiaries-->
                                <!-- <option value="3">AUTOSAFE S.A.C.</option>
                                <option value="2">CARSEG</option> -->
                            </select>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <label for="custpage_period_field" class="col-sm-2 col-form-label">Periodo</label>
                        <div class="col-sm-6">
                            <select class="form-select col-sm-2 col-form-select-sm" id="custpage_period_field"
                                name="custpage_period_field" required>
                                <option value="">Seleccione...</option>
                                <!--optionsContentPeriods-->
                            </select>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <label for="custpage_format_field" class="col-sm-2 col-form-label">Formato</label>
                        <div class="col-sm-6">
                            <select class="form-select col-sm-2 col-form-select-sm" id="custpage_format_field"
                                name="custpage_format_field" required>
                                <option value="">Seleccione...</option>
                                <option value="ventas">VENTAS</option>
                            </select>
                        </div>
                    </div>
                </section>
                <section class="col-sm-6">
                    <div class="card" style="width: 20rem;">
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item">Usuario.</li>
                            <li class="list-group-item">Subsidiaria.</li>
                            <li class="list-group-item">Periodo.</li>
                            <li class="list-group-item">Reporte.</li>
                            <li class="list-group-item d-grid"><a href="#" class="btn btn-success btn-sm disabled"
                                    id="generateExcel" aria-disabled="true">Descargar</a>
                            </li>
                        </ul>
                    </div>
                </section>
            </div>
            <!-- <br>
            <br>
            <br> -->
            <!-- <div class="col-sm-12 d-flex">
                <div class="col-sm-3"></div>
                <div class="col-sm-6">
                    <div class="progress" role="progressbar" aria-label="Animated striped example" aria-valuenow="90"

                        <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 90%">90%
                        </div>
                    </div>
                </div>
            </div> -->
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Habilitar el botón
            //<!--enabledButton-->
        })
        // Definir las cabeceras del Excel
        const headers = [
            "RUC Empresa",
            "Periodo: MES",
            "Periodo: Año",
            "Tipo Identificacion",
            "Ruc / Cédula / Pasaporte",
            "Nombre (Opcional)",
            "Parterelvtas",
            "Establecimiento",
            "Co. Comprobante",
            "Cantidad De Comprob /Mes",
            "Factura Sistema",
            "Fac. Físico",
            "Base No Aplica Iva",
            "Base Impon. Tarifa 0%",
            "Base Impon. Tarifa <> 0%",
            "Monto Iva",
            "Declarar Ret.Iva",
            "Iva 10%",
            "Iva 20%",
            "Iva 30%",
            "Iva 70%",
            "Iva 100%",
            "Monto Ice",
            "Monto Ret. Iva",
            "Declarar Ret.Renta",
            "Monto Ret. Ir",
            "Ir 1%",
            "Ir 2%",
            "Ir 0%",
            "Fecha De Emision",
            "Serie",
            "Secuencia",
            "Autorizacion",
            "Origenrtf",
            "Oficinartf",
            "Tasa Iva Movimiento",
            "Dscto.2% Solidario",
            "Tiportf",
            "Fec.Emisión Documento",
            "Fec.Autorización Sri",
            "Denominación Cliente",
            "Tipo Emisión",
            "Tipo Compen.",
            "Monto Compensación",
            "Forma Pago",
            "Ir 1.75",
            "Ir 2.75%",
            "Par Rel.",
            "Monto Ice",
            "Tipo Id. Sri"
        ]

        // Función para crear una hoja con cabeceras personalizadas
        function createSheetWithHeaders(data, headers) {
            // Convertir el arreglo a una hoja de trabajo
            const worksheet = XLSX.utils.json_to_sheet(data, { header: headers });
            return worksheet;
        }

        document.getElementById("generateExcel").addEventListener("click", () => {
            // Datos de ejemplo
            //<!--dataContent-->

            // const data = [
            //     { "RUC Empresa": "Betsabe", "Ruc / Cédula / Pasaporte": 30, "Base Impon. Tarifa <> 0%": "Quito" },
            //     { "RUC Empresa": "Carlos", "Ruc / Cédula / Pasaporte": 25, "Base Impon. Tarifa <> 0%": "Guayaquil" },
            //     { "RUC Empresa": "Ana", "Ruc / Cédula / Pasaporte": 28, "Base Impon. Tarifa <> 0%": "Cuenca" }
            // ];

            // Crear la hoja de trabajo con cabeceras
            const worksheet = createSheetWithHeaders(data, headers);

            // Crear un libro de trabajo y agregar la hoja
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Datos");

            // Exportar el archivo Excel
            XLSX.writeFile(workbook, "Datos.xlsx");
        });
    </script>

</body>

</html>
